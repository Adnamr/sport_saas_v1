      - "Validation du refresh token"
      - "Génération nouveau access token"
      - "Rotation optionnelle du refresh token"
      - "**Module:** auth"

  - id: "E3-009"
    title: "Forgot Password - Demande de reset"
    module: "auth"
    priority: "medium"
    estimated_hours: 3
    sprint: "Sprint 3"
    status: "new"
    acceptance_criteria:
      - "POST /api/auth/forgot-password"
